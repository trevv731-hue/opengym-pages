<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>ActiveT · 系统维护中</title>
  <meta name="theme-color" content="#0c0e12">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0c0e12;
      color: #e5e5e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #17191e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      padding: 44px 28px 36px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 149, 0, 0.15);
      color: #ff9f0a;
      border: 1px solid rgba(255, 149, 0, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff9f0a;
      box-shadow: 0 0 8px #ff9f0a;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: #8e8e93;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .footer {
      font-size: 12px;
      color: #636366;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="dot"></span>
      <span>封闭测试中</span>
    </div>
    <h1>系统维护中</h1>
    <p>ActiveT 目前正在进行内部封闭测试与功能调整，公共访问暂时关闭。感谢您的理解与耐心等待。</p>
    <div class="footer">
      ActiveT · 私人数据空间
    </div>
  </div>
</body>
</html>
